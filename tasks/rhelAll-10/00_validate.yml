---
- name: Validate OpenHands Codex proxy inputs
  ansible.builtin.assert:
    that:
      - ansible_os_family == 'RedHat'
      - ansible_distribution_major_version | int == 10
      - openhands_codex_proxy_runtime_access_mode in ['public', 'allowlist']
      - openhands_codex_proxy_runtime_access_mode != 'allowlist' or (openhands_codex_proxy_runtime_allowed_cidrs | length > 0)
      - not (openhands_codex_proxy_do_basic_auth | bool) or (openhands_codex_proxy_basic_auth_password | length >= 12)
    fail_msg: >-
      Use Rocky/RHEL 10, a valid runtime access mode, and when Basic Auth is
      enabled supply a 12-or-more-character password through a secret manager.
  no_log: true
