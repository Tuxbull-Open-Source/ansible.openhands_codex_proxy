---
- name: Enable and start Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Enable and start nginx
  ansible.builtin.systemd:
    name: nginx
    enabled: true
    state: started

- name: Enable and start firewalld
  ansible.builtin.systemd:
    name: firewalld
    enabled: true
    state: started
  when: openhands_codex_proxy_enable_firewall | bool

- name: Allow HTTP service in firewalld for redirect
  ansible.posix.firewalld:
    service: http
    permanent: true
    immediate: true
    state: enabled
  when: openhands_codex_proxy_enable_firewall | bool

- name: Allow HTTPS service in firewalld
  ansible.posix.firewalld:
    service: https
    permanent: true
    immediate: true
    state: enabled
  when: openhands_codex_proxy_enable_firewall | bool

- name: Pull Compose images
  ansible.builtin.command:
    cmd: "docker compose -f {{ openhands_codex_proxy_project_dir }}/docker-compose.yml pull"
  register: openhands_codex_proxy_pull_result
  changed_when: "'Downloaded newer image' in openhands_codex_proxy_pull_result.stdout or 'Pull complete' in openhands_codex_proxy_pull_result.stdout"
  when:
    - openhands_codex_proxy_start_stack | bool
    - openhands_codex_proxy_pull_images | bool

- name: Start OpenHands Compose stack
  ansible.builtin.command:
    cmd: "docker compose -f {{ openhands_codex_proxy_project_dir }}/docker-compose.yml up -d"
  register: openhands_codex_proxy_compose_up
  changed_when: "'Created' in openhands_codex_proxy_compose_up.stdout or 'Started' in openhands_codex_proxy_compose_up.stdout or 'Recreated' in openhands_codex_proxy_compose_up.stdout"
  when: openhands_codex_proxy_start_stack | bool
