---
- name: Restart nginx
  ansible.builtin.systemd:
    name: nginx
    state: restarted

- name: Restart OpenHands compose stack
  ansible.builtin.command:
    cmd: "docker compose -f {{ openhands_codex_proxy_project_dir }}/docker-compose.yml restart"
  changed_when: true
  when: openhands_codex_proxy_start_stack | bool
